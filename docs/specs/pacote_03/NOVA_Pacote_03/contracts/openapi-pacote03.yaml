openapi: 3.0.3
info:
  title: NOVA Investimentos — Pacote 03
  version: 3.0.0
  description: Todas as operações requerem sessão autenticada, autorização por workspace e idempotência para escrita.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /workspaces/{workspaceId}/investments/summary:
    get:
      operationId: getInvestmentSummary
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses: {'200': {description: KPIs com cobertura/frescor de fontes}, '403': {description: Sem acesso}}
  /workspaces/{workspaceId}/investments/portfolios:
    get:
      operationId: listPortfolios
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses: {'200': {description: Carteiras}}
    post:
      operationId: createPortfolio
      parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: {name: {type: string, maxLength: 120}}
      responses: {'201': {description: Carteira criada}, '409': {description: Conflito de idempotência}}
  /workspaces/{workspaceId}/investments/operations:
    get:
      operationId: listInvestmentOperations
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses: {'200': {description: Operações paginadas}}
    post:
      operationId: createInvestmentOperation
      parameters: [{ $ref: '#/components/parameters/workspaceId' }, { $ref: '#/components/parameters/idempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portfolioId, instrumentId, kind, quantity, grossAmount, tradeDate]
              properties:
                portfolioId: {type: string, format: uuid}
                instrumentId: {type: string, format: uuid}
                kind: {type: string, enum: [BUY, SELL, DIVIDEND, INTEREST, FEE, TAX, AMORTIZATION, MATURITY, REVERSAL]}
                quantity: {type: string, description: Decimal exato}
                grossAmount: {type: string, description: Decimal monetário exato}
                tradeDate: {type: string, format: date}
      responses: {'201': {description: Registrado}, '422': {description: Erro de validação}, '409': {description: Requisição duplicada ou conflito}}
  /workspaces/{workspaceId}/investments/comparison:
    post:
      operationId: compareInvestments
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, horizonDays]
              properties:
                amount: {type: string}
                horizonDays: {type: integer, minimum: 1}
                liquidity: {type: string}
      responses: {'200': {description: Ranking explicável com fonte e ressalvas}, '503': {description: Sem cotações válidas}}
  /workspaces/{workspaceId}/investments/simulations:
    post:
      operationId: simulateWealth
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal, monthlyContribution, years, annualRate]
              properties:
                principal: {type: string}
                monthlyContribution: {type: string}
                years: {type: integer, minimum: 1, maximum: 60}
                annualRate: {type: number, minimum: -0.99}
      responses: {'200': {description: Simulação hipotética versionada}}
  /workspaces/{workspaceId}/investments/quotes/health:
    get:
      operationId: getQuoteHealth
      parameters: [{ $ref: '#/components/parameters/workspaceId' }]
      responses: {'200': {description: Fontes, atualizações e defasagens}}
components:
  securitySchemes:
    cookieAuth: {type: apiKey, in: cookie, name: nova_session}
  parameters:
    workspaceId: {name: workspaceId, in: path, required: true, schema: {type: string, format: uuid}}
    idempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
