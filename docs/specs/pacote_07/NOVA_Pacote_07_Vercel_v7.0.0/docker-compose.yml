services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - nova_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  nova_pgdata:
